name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools"
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK (all flavors)
        working-directory: ScreenQrScanner
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: List APK outputs
        run: find ScreenQrScanner/app/build/outputs/apk -name "*.apk" -type f
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenQrScanner-dual
          path: ScreenQrScanner/app/build/outputs/apk/dual/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenQrScanner-wechat
          path: ScreenQrScanner/app/build/outputs/apk/wechat/debug/*.apk
          if-no-files-found: error
